# Tag a commit vX.Y.Z and push the tag: the deck is built offline and
# attached to a GitHub release of that tag, so the "latest release" link on
# the deck page always points at a build of tagged source.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline build
        run: ./build_single.sh --no-fetch
      - name: Title and summary from the data
        id: deck
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, "scripts")
          import update_numbers
          f = update_numbers.facts()
          print(f"title=Lietuvių A2 — {f['notes']:,} words")
          print(f"summary={f['notes']:,} words · {f['cards']:,} cards · "
                f"{f['recordings']:,} recordings · {f['paradigms']} hand-checked paradigms")
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.deck.outputs.title }}
          body: |
            **${{ steps.deck.outputs.summary }}.**

            Download `lietuviu_A2.apkg` and import it into Anki (File → Import).
            Importing over an earlier version updates the cards in place.
          append_body: true
          generate_release_notes: true
          files: decks/lietuviu_A2.apkg
