# Tool configuration only. The project is a set of scripts, not a package:
# install with `pip install -r requirements-dev.txt` (see README).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
filterwarnings = [
    # genanki's dependency, not ours
    "ignore::DeprecationWarning:cached_property",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# design history: CSS inside f-strings
"scripts/design/themes*_candidates.py" = ["E501"]
